<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>观察小镇 V2</title>
  <style>
    :root {
      --bg: #f5f4ef;
      --panel: #fff;
      --map: #eaf0e3;
      --road: #d4cbb8;
      --line: #d9d7ce;
      --ink: #1e1e1e;
      --muted: #6d7268;
      --weak: #92978d;
      --green: #4f8f5d;
      --blue: #3b74a5;
      --amber: #c48435;
      --red: #b3564d;
      --violet: #8063a2;
      --cyan: #3b8f92;
      --shadow: 0 12px 28px rgba(38, 43, 34, .09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    h1, h2, h3, p { margin: 0; }
    button, select, input {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      min-height: 32px;
      padding: 6px 10px;
    }
    button { cursor: pointer; }
    button:hover { border-color: #9ca391; }
    button.primary { background: var(--green); border-color: var(--green); color: #fff; }
    button.active { background: #e9f2e7; border-color: var(--green); color: #245532; }
    button.icon { width: 32px; padding: 0; }
    a { color: inherit; text-decoration: none; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(245,244,239,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .top-main, .top-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
    }
    .top-metrics {
      padding-top: 0;
      flex-wrap: wrap;
      justify-content: flex-start;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 260px; }
    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #273126;
      color: #e8f3db;
      font-weight: 800;
    }
    h1 { font-size: 18px; }
    .minor { color: var(--muted); font-size: 12px; }
    .toolbar, .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--weak);
      display: inline-block;
    }
    .dot.run { background: var(--blue); }
    .dot.pause { background: var(--amber); }
    .dot.ok { background: var(--green); }
    .dot.bad { background: var(--red); }
    .metric {
      min-width: 112px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px 10px;
    }
    .metric span { display: block; color: var(--muted); font-size: 11px; }
    .metric strong { display: block; margin-top: 3px; font-size: 18px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(500px, 1.25fr) minmax(360px, .9fr) minmax(330px, .75fr);
      gap: 14px;
      padding: 14px;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .panel h2 { font-size: 15px; }
    .panel-body { padding: 12px 14px; }
    .map {
      position: relative;
      height: 540px;
      background:
        linear-gradient(28deg, transparent 0 45%, rgba(212,203,184,.85) 45% 51%, transparent 51%),
        linear-gradient(97deg, transparent 0 47%, rgba(212,203,184,.75) 47% 52%, transparent 52%),
        var(--map);
      overflow: hidden;
    }
    .district {
      position: absolute;
      width: 132px;
      text-align: left;
      border: 1px solid var(--line);
      border-left: 6px solid var(--green);
      border-radius: 8px;
      background: rgba(255,255,255,.9);
      padding: 9px 10px;
      box-shadow: 0 10px 20px rgba(38,43,34,.1);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .district:hover, .district.active {
      transform: translateY(-1px);
      box-shadow: 0 0 0 4px rgba(79,143,93,.18), 0 12px 24px rgba(38,43,34,.16);
      border-color: #80917a;
    }
    .district h3 { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .district p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .district::before {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(79,143,93,.16);
    }
    .district.wait::before { background: var(--amber); box-shadow: 0 0 0 3px rgba(196,132,53,.16); }
    .district.risk::before { background: var(--red); box-shadow: 0 0 0 3px rgba(179,86,77,.16); }
    .district.tension::before { background: var(--violet); box-shadow: 0 0 0 3px rgba(128,99,162,.16); }
    .district.home { border-left-color: var(--green); }
    .district.school { border-left-color: var(--blue); }
    .district.food { border-left-color: var(--amber); }
    .district.clinic { border-left-color: var(--red); }
    .district.office { border-left-color: #274f82; }
    .district.social { border-left-color: var(--violet); }
    .district.leisure { border-left-color: var(--cyan); }
    .district.shop { border-left-color: #c4a33c; }
    .place-detail {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .fact {
      border: 1px solid rgba(217,215,206,.86);
      border-radius: 8px;
      background: #fffdfa;
      padding: 9px 10px;
      min-width: 0;
    }
    .fact span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .fact strong { display: block; overflow-wrap: anywhere; }
    .fact.wide { grid-column: 1 / -1; }
    .agent-list { display: grid; gap: 8px; max-height: 480px; overflow: auto; }
    .agent-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      text-align: left;
      border-radius: 8px;
      padding: 10px;
    }
    .agent-row strong { display: block; font-size: 14px; }
    .agent-row small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .agent-row em { align-self: start; font-style: normal; color: var(--muted); font-size: 12px; }
    .person-head {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 10px;
      align-items: center;
    }
    .avatar {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #273126;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
    }
    .bars { margin-top: 12px; display: grid; gap: 8px; }
    .bar {
      display: grid;
      grid-template-columns: 64px 1fr 34px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .track { height: 8px; border-radius: 999px; background: #dfe4d8; overflow: hidden; }
    .fill { height: 100%; border-radius: inherit; background: var(--green); }
    .fill.blue { background: var(--blue); }
    .fill.amber { background: var(--amber); }
    .fill.red { background: var(--red); }
    .kv { display: grid; grid-template-columns: 86px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(217,215,206,.72); }
    .kv span { color: var(--muted); }
    .event, .task {
      display: grid;
      grid-template-columns: 66px 1fr auto;
      gap: 8px;
      padding: 9px 0;
      border-top: 1px solid rgba(217,215,206,.72);
      font-size: 12px;
    }
    .event:first-child, .task:first-child { border-top: 0; }
    .event time, .task time { color: var(--muted); }
    .event strong, .task strong { display: block; font-size: 12px; }
    .event p, .task p { color: var(--muted); }
    .bottom {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
      gap: 14px;
    }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; font-size: 12px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid rgba(217,215,206,.78); text-align: left; }
    th { color: var(--muted); background: #f0f1eb; font-weight: 700; }
    tbody tr { cursor: pointer; }
    tbody tr:hover td { background: #f8faf4; }
    tr.selected td { background: #eef6ec; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 3px 8px;
      background: #edf2e8;
      color: #31583b;
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.warn { background: #f7ecdc; color: #7a4b18; }
    .badge.danger { background: #f7e4e1; color: #83372f; }
    .badge.violet { background: #eee7f5; color: #5a4575; }
    .mini-meter {
      display: grid;
      grid-template-columns: 34px 64px;
      gap: 6px;
      align-items: center;
    }
    .mini-meter i {
      height: 6px;
      border-radius: 999px;
      background: #dfe4d8;
      overflow: hidden;
    }
    .mini-meter b {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
    }
    .mini-meter.red b { background: var(--red); }
    details { border-top: 1px solid rgba(217,215,206,.78); padding-top: 10px; margin-top: 10px; }
    summary { cursor: pointer; color: var(--muted); }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(30,30,30,.38);
    }
    .modal.open { display: grid; }
    .modal-card {
      width: min(960px, 100%);
      max-height: 92vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 22px 60px rgba(30,30,30,.25);
      overflow: hidden;
    }
    .modal-body { padding: 14px; overflow: auto; }
    .modal-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .people { display: flex; flex-wrap: wrap; gap: 8px; }
    .people button { border-radius: 999px; }
    @media (max-width: 1180px) {
      .layout, .bottom { grid-template-columns: 1fr; }
      .map { height: 480px; }
      .place-detail, .modal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="top-main">
        <div class="brand">
          <div class="mark">AT</div>
          <div>
            <h1>观察小镇 V2</h1>
            <p class="minor" id="subtitle">正在读取运行数据</p>
          </div>
        </div>
        <div class="toolbar">
          <span class="pill"><i class="dot pause" id="runDot"></i><span id="runState">等待</span></span>
          <select id="saveSelect" aria-label="选择存档"></select>
          <button id="refreshBtn" type="button">刷新</button>
          <button id="stepBtn" type="button">单步</button>
          <button class="primary" id="toggleBtn" type="button">启动</button>
        </div>
      </div>
      <div class="top-metrics" id="metrics"></div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>小镇地图</h2>
            <p class="minor">地点可点击查看容量、在场角色、运行状态和二级角色信息</p>
          </div>
          <span class="pill" id="placeCount">0 地点</span>
        </div>
        <div class="map" id="map"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>居民状态</h2>
            <p class="minor">列表只保留人能读懂的状态，技术字段放入诊断</p>
          </div>
          <div class="filters">
            <input id="agentSearch" type="search" placeholder="搜索角色/地点/状态">
            <button class="active" data-filter="all" type="button">全部</button>
            <button data-filter="risk" type="button">异常</button>
            <button data-filter="social" type="button">社交</button>
            <button data-filter="work" type="button">工作</button>
            <button data-filter="rest" type="button">休息</button>
          </div>
        </div>
        <div class="panel-body">
          <div class="agent-list" id="agentList"></div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <div>
            <h2>当前居民</h2>
            <p class="minor">人物卡优先显示状态、任务、需求和心理压力</p>
          </div>
        </div>
        <div class="panel-body" id="agentCard"></div>
      </aside>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>当前地点详情</h2>
            <p class="minor">与地图选中地点联动</p>
          </div>
        </div>
        <div class="panel-body place-detail" id="placeDetail"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>世界事件</h2>
            <p class="minor">只显示自然语言事件，系统错误和技术日志移到诊断</p>
          </div>
        </div>
        <div class="panel-body" id="worldEvents"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>后台任务</h2>
            <p class="minor">技术任务名翻译为观察台语言</p>
          </div>
        </div>
        <div class="panel-body" id="taskList"></div>
      </section>

      <section class="bottom">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>角色数据</h2>
              <p class="minor">底部保留完整扫描表，点击行同步人物卡</p>
            </div>
            <span class="pill" id="agentCount">0 / 0</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>角色</th><th>身份</th><th>位置</th><th>情绪</th><th>健康</th><th>压力</th><th>主要需求</th><th>当前任务</th><th>状态</th></tr></thead>
              <tbody id="agentTable"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>系统诊断</h2>
              <p class="minor">低频技术信息折叠在这里，不污染世界事件</p>
            </div>
          </div>
          <div class="panel-body" id="diagnostics"></div>
        </section>
      </section>
    </main>
  </div>

  <div class="modal" id="placeModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="panel-head">
        <div>
          <h2 id="modalTitle">地点信息</h2>
          <p class="minor" id="modalHint">点击角色名称查看二级角色信息</p>
        </div>
        <button class="icon" id="closeModal" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const apiBase = location.protocol === "file:" ? "http://127.0.0.1:8788" : "";
    const api = path => fetch(apiBase + path).then(res => {
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    });
    const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
    const clamp = value => Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
    const pct = value => value == null ? "-" : (Number.isFinite(Number(value)) ? Number(value).toFixed(6) : "-");
    const needNames = { hunger:"饱腹", hygiene:"清洁", health:"健康", social:"社交", responsibility:"责任", stress:"抗压", comfort:"舒适", safety:"安全" };
    const moodNames = { happy:"开心", anxious:"焦虑", angry:"愤怒", sad:"悲伤", tired:"疲惫", lonely:"孤独", hopeful:"希望", calm:"平静", curious:"好奇" };
    const taskNames = {
      socialProcessAgent: "社交流程分析",
      relationshipDynamicsAgent: "关系动态分析",
      eventImpactAgent: "事件影响分析",
      stateSettlementAgent: "状态结算",
      "Node Core Tick": "世界推进",
      locationRuntime: "地点运行",
      relationshipBuffer: "关系缓冲合并",
      memory: "记忆整理"
    };
    const stageNames = { child:"儿童", teen:"青少年", adult:"成年人", elder:"老年人" };
    const metricGroups = { town:"小镇状态", cognition:"认知运行" };
    let saves = [];
    let world = { agents: [], places: [], logs: [], records: [] };
    let runtime = {};
    let selectedAgent = "";
    let selectedPlace = "";
    let filterMode = "all";
    let viewState = "loading";
    let loadingWorld = null;

    function agents() {
      return Array.isArray(world.agents) ? world.agents : Object.values(world.agents || {});
    }
    function places() {
      return Array.isArray(world.places) ? world.places : Object.values(world.places || {});
    }
    function placeName(id) {
      return places().find(p => p.id === id)?.name || id || "未知地点";
    }
    function stageName(value) {
      return stageNames[value] || value || "-";
    }
    function locationOf(agent) {
      return agent.position || agent.place || agent.location || "";
    }
    function strongestMood(agent) {
      if (agent.emotion) return agent.emotion;
      const entries = Object.entries(agent.emotionVector || agent.emotions || {});
      return entries.sort((a, b) => Number(b[1]) - Number(a[1]))[0]?.[0] ? moodNames[entries.sort((a, b) => Number(b[1]) - Number(a[1]))[0][0]] || entries[0][0] : "平静";
    }
    function pressure(agent) {
      return clamp(100 - Number(agent.needs?.stress ?? 100));
    }
    function primaryNeed(agent) {
      const entries = Object.entries(agent.needs || {});
      if (!entries.length) return ["-", 0];
      const [key, value] = entries.sort((a, b) => Number(a[1]) - Number(b[1]))[0];
      return [needNames[key] || key, clamp(value)];
    }
    function currentAction(agent) {
      const process = agent.activeProcess || {};
      return process.currentStep || process.goal || agent.currentTask || agent.action || agent.goal || "维持当前安排";
    }
    function statusOf(agent) {
      const process = agent.activeProcess || {};
      if (process.blockedBy || process.stage === "blocked") return "阻塞";
      if (clamp(agent.needs?.health) < 35 || clamp(agent.needs?.hunger) < 20 || clamp(agent.needs?.safety) < 25) return "危机";
      if (pressure(agent) > 70 || clamp(agent.emotionVector?.anxious) > 75) return "高压";
      if (agent.isSleeping) return "休息";
      if (agent.movement) return "移动";
      return "平稳";
    }
    function statusClass(status) {
      if (["危机","高压"].includes(status)) return "danger";
      if (["阻塞","移动"].includes(status)) return "warn";
      if (status === "休息") return "violet";
      return "";
    }
    function placeState(place) {
      const here = agents().filter(agent => locationOf(agent) === place.id);
      const blocked = here.some(agent => statusOf(agent) === "阻塞");
      const tense = here.filter(agent => ["高压","危机"].includes(statusOf(agent))).length;
      const crowded = place.capacity && here.length / Number(place.capacity) > 0.75;
      if (blocked) return "risk";
      if (tense) return "tension";
      if (crowded) return "wait";
      return "ok";
    }
    function memoryCount(agent) {
      return ["short","long","emotional","secret","rumor"].reduce((sum, key) => sum + (agent.memory?.[key]?.length || 0), 0)
        + ["episodicMemory","beliefMemory","habitMemory","preferenceMemory","relationshipMemory","causalMemory","reflectionMemory"].reduce((sum, key) => sum + (agent[key]?.length || 0), 0);
    }
    function relationCount(agent) {
      return Object.keys(agent.relationshipMatrix || agent.relationships || agent.relations || {}).length;
    }
    function placeKind(place) {
      const text = `${place.id || ""} ${place.name || ""}`.toLowerCase();
      if (/apartment|home|house|居民|住宅/.test(text)) return "home";
      if (/school|学校|教师|学生/.test(text)) return "school";
      if (/breakfast|food|餐|饭|早餐/.test(text)) return "food";
      if (/clinic|hospital|诊所|医院|医疗/.test(text)) return "clinic";
      if (/office|政府|政务|镇务/.test(text)) return "office";
      if (/square|plaza|广场|公共/.test(text)) return "social";
      if (/river|park|公园|河|休闲/.test(text)) return "leisure";
      if (/store|shop|market|商店|小卖部|市场/.test(text)) return "shop";
      return "home";
    }
    function typeName(kind) {
      return { home:"居住", school:"教育", food:"饮食", clinic:"医疗", office:"公共事务", social:"公共社交", leisure:"休闲", shop:"商业" }[kind] || "地点";
    }
    function formatClock() {
      const save = saves.find(item => item.slot === $("saveSelect").value);
      if (save?.clockText) return save.clockText;
      const clock = Number(world.clock || 0);
      const day = Math.floor(clock / 1440) + 1;
      const hour = String(Math.floor((clock % 1440) / 60)).padStart(2, "0");
      const min = String(clock % 60).padStart(2, "0");
      return `第 ${day} 天 ${hour}:${min}`;
    }
    function vectorCosine(a = {}, b = {}) {
      const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
      let aa = 0, bb = 0, ab = 0;
      keys.forEach(key => {
        const x = Number(a[key] || 0);
        const y = Number(b[key] || 0);
        aa += x * x; bb += y * y; ab += x * y;
      });
      return aa && bb ? ab / (Math.sqrt(aa) * Math.sqrt(bb)) : null;
    }
    function avgStability() {
      const values = agents().map(agent => {
        const cur = agent.psychologicalState || {};
        const prev = agent.previousPsychologicalState || {};
        const cosine = vectorCosine(cur.vector, prev.vector);
        if (cosine != null) return cosine;
        const transition = Number(cur.projection?.transitionPressure?.total);
        return Number.isFinite(transition) ? 1 - Math.max(0, Math.min(1, transition)) : null;
      }).filter(value => value != null);
      return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
    }
    function naturalLogs() {
      return [...(world.records || []), ...(world.logs || []), ...(world.eventLog || [])]
        .filter(item => {
          const text = `${item.title || ""} ${item.body || ""} ${item.summary || ""} ${item.text || ""} ${item.source || ""}`;
          return !/fallback|json|vector|token|retry|schema|debug|audit|kernel|cognitive|system_error/i.test(text);
        })
        .slice(-8)
        .reverse();
    }
    function taskRows() {
      const queue = world.actionQueue || [];
      if (queue.length) return queue.slice(0, 7).map(item => ({
        time: item.at || item.tick || "-",
        title: taskNames[item.actionType] || taskNames[item.type] || item.actionType || item.type || "后台任务",
        body: item.agentName || item.agentId || item.reason || "等待执行",
        state: item.priority || item.status || ""
      }));
      const progress = runtime.progress || {};
      return [
        { time: `${progress.percent ?? 0}%`, title: "世界推进", body: progress.currentTask || progress.phase || "暂无后台任务", state: progress.running ? "运行中" : "空闲" },
        { time: "内核", title: "认知边界", body: runtime.cognitiveKernel?.ok ? "提交器版本一致" : "需要检查", state: runtime.cognitiveKernel?.ok ? "正常" : "检查" }
      ];
    }
    function renderMetrics() {
      const list = agents();
      if (viewState === "loading") {
        $("metrics").innerHTML = `<div class="metric"><span>状态</span><strong>正在读取小镇状态...</strong></div>`;
        return;
      }
      if (viewState === "empty") {
        $("metrics").innerHTML = `<div class="metric"><span>状态</span><strong>暂无存档</strong></div>`;
        return;
      }
      const avg = key => list.length ? Math.round(list.reduce((sum, agent) => sum + Number(agent.needs?.[key] || 0), 0) / list.length) : 0;
      const risky = list.filter(agent => ["阻塞","危机","高压"].includes(statusOf(agent))).length;
      $("metrics").innerHTML = [
        [metricGroups.town, "居民", list.length],
        [metricGroups.town, "健康均值", avg("health")],
        [metricGroups.town, "异常角色", risky],
        [metricGroups.town, "关系事件", list.reduce((sum, agent) => sum + relationCount(agent), 0)],
        [metricGroups.cognition, "S(t)稳定", pct(avgStability())],
        [metricGroups.cognition, "记忆写入", list.reduce((sum, agent) => sum + memoryCount(agent), 0)],
        [metricGroups.cognition, "后台队列", world.actionQueue?.length || 0]
      ].map(([group, label, value]) => `<div class="metric"><span>${esc(group)} · ${esc(label)}</span><strong>${esc(value)}</strong></div>`).join("");
    }
    function renderTop() {
      const running = runtime.state === "running" || runtime.running;
      $("runDot").className = `dot ${running ? "run" : "pause"}`;
      $("runState").textContent = viewState === "loading" ? "正在读取小镇状态..." : `${formatClock()} · ${running ? "运行中" : "已暂停"}`;
      $("toggleBtn").textContent = running ? "暂停" : "启动";
      $("subtitle").textContent = viewState === "loaded"
        ? `${agents().length} 位居民正在模拟 · ${formatClock()} · 单状态认知模式`
        : viewState === "empty"
          ? "暂无存档，请先建镇或加载存档"
          : "正在读取小镇状态...";
    }
    function renderMap() {
      const map = $("map");
      map.innerHTML = "";
      if (viewState !== "loaded") {
        map.innerHTML = `<div class="fact" style="position:absolute;left:18px;top:18px;width:260px"><span>状态</span><strong>${viewState === "loading" ? "正在读取地图数据..." : "暂无地点数据"}</strong></div>`;
        $("placeCount").textContent = `0 地点`;
        return;
      }
      places().forEach((place, index) => {
        const kind = placeKind(place);
        const count = agents().filter(agent => locationOf(agent) === place.id).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `district ${kind} ${placeState(place)}${selectedPlace === place.id ? " active" : ""}`;
        btn.dataset.place = place.id;
        btn.style.left = `${Math.max(2, Math.min(78, Number(place.x ?? 8 + (index % 4) * 22)))}%`;
        btn.style.top = `${Math.max(10, Math.min(82, Number(place.y ?? 18 + Math.floor(index / 4) * 22)))}%`;
        btn.innerHTML = `<h3>${esc(place.name || place.id)}</h3><p>${count} 人 · ${typeName(kind)}</p>`;
        btn.addEventListener("click", () => selectPlace(place.id, true));
        map.appendChild(btn);
      });
      $("placeCount").textContent = `${places().length} 地点`;
    }
    function placeFacts(place) {
      const here = agents().filter(agent => locationOf(agent) === place.id);
      const runtimeInfo = world.locationRuntime?.[place.id] || {};
      const box = world.locationBoxes?.[place.id] || {};
      const daily = world.locationDailyPlans?.[place.id] || {};
      return [
        ["地点", place.name || place.id],
        ["人数", `${here.length} / ${place.capacity || "-"}`],
        ["类型", typeName(placeKind(place))],
        ["状态", box.phase || runtimeInfo.mode || box.state?.tempo || "平常"],
        ["可见地点", (place.visible || []).map(placeName).join("、") || "无"],
        ["今日重点", daily.focus || "暂无"],
        ["在场角色", here.map(agent => agent.name || agent.id).join("、") || "无人", "wide"],
        ["运行信息", runtimeInfo.summary || box.summary || "暂无地点运行信息", "wide"]
      ];
    }
    function renderPlaceDetail() {
      if (viewState !== "loaded") {
        $("placeDetail").innerHTML = `<div class="fact wide"><strong>${viewState === "loading" ? "正在读取地点详情..." : "暂无地点详情"}</strong></div>`;
        return;
      }
      const place = places().find(item => item.id === selectedPlace) || places()[0];
      if (!place) {
        $("placeDetail").innerHTML = `<div class="fact wide"><strong>暂无地点数据</strong></div>`;
        return;
      }
      $("placeDetail").innerHTML = placeFacts(place).map(([label, value, wide]) => `<div class="fact ${wide || ""}"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join("");
    }
    function renderAgentList() {
      if (viewState !== "loaded") {
        $("agentCount").textContent = `0 / 0`;
        $("agentList").innerHTML = `<p class="minor">${viewState === "loading" ? "正在读取角色数据..." : "暂无角色数据"}</p>`;
        return;
      }
      const query = $("agentSearch").value.trim().toLowerCase();
      const visible = agents().filter(agent => {
        const text = `${agent.name} ${agent.job} ${placeName(locationOf(agent))} ${statusOf(agent)} ${currentAction(agent)}`.toLowerCase();
        const status = statusOf(agent);
        const action = currentAction(agent);
        if (query && !text.includes(query)) return false;
        if (filterMode === "risk") return ["阻塞","危机","高压"].includes(status);
        if (filterMode === "social") return /社交|联系|交谈|social|contact/i.test(action) || primaryNeed(agent)[0] === "社交";
        if (filterMode === "work") return /工作|职责|任务|work|plan/i.test(action);
        if (filterMode === "rest") return /休息|睡眠|回家|rest|sleep|home/i.test(action) || status === "休息";
        return true;
      });
      $("agentCount").textContent = `${visible.length} / ${agents().length}`;
      $("agentList").innerHTML = visible.map(agent => {
        const [need, value] = primaryNeed(agent);
        return `<button class="agent-row ${selectedAgent === agent.id ? "active" : ""}" data-agent="${esc(agent.id)}" type="button">
          <span><strong>${esc(agent.name || agent.id)} · ${esc(agent.job || "居民")}</strong><small>${esc(placeName(locationOf(agent)))} · ${esc(strongestMood(agent))} · 精力 ${clamp(agent.energy ?? agent.needs?.comfort)} · ${esc(need)} ${value}</small><small>当前：${esc(currentAction(agent))}</small></span>
          <em class="badge ${statusClass(statusOf(agent))}">${esc(statusOf(agent))}</em>
        </button>`;
      }).join("") || `<p class="minor">没有符合条件的角色</p>`;
      document.querySelectorAll("[data-agent]").forEach(btn => btn.addEventListener("click", () => selectAgent(btn.dataset.agent)));
    }
    function bars(agent) {
      const rows = [
        ["健康", agent.needs?.health, ""],
        ["饱腹", agent.needs?.hunger, "blue"],
        ["社交", agent.needs?.social, "blue"],
        ["压力", pressure(agent), pressure(agent) > 70 ? "red" : "amber"],
        ["安全", agent.needs?.safety, ""]
      ];
      return rows.map(([label, value, tone]) => `<div class="bar"><span>${esc(label)}</span><div class="track"><div class="fill ${tone}" style="width:${clamp(value)}%"></div></div><b>${clamp(value)}</b></div>`).join("");
    }
    function renderAgentCard() {
      if (viewState !== "loaded") {
        $("agentCard").innerHTML = `<p class="minor">${viewState === "loading" ? "正在读取角色详情..." : "暂无角色详情"}</p>`;
        return;
      }
      const agent = agents().find(item => item.id === selectedAgent) || agents()[0];
      if (!agent) {
        $("agentCard").innerHTML = `<p class="minor">暂无角色数据</p>`;
        return;
      }
      const rels = Object.entries(agent.relationshipMatrix || agent.relationships || {}).slice(0, 5).map(([id, rel]) => {
        const other = agents().find(item => item.id === id);
        return typeof rel === "number"
          ? `${other?.name || id}: ${Math.round(rel)}`
          : `${other?.name || id}: 信任${Math.round(rel.trust || 0)} 亲密${Math.round(rel.intimacy || rel.affinity || 0)} 紧张${Math.round(rel.resentment || 0)}`;
      });
      const psych = agent.psychologicalState?.projection?.attractorLandscape;
      const dominant = psych?.dominantAttractor ? `主导吸引子：${psych.dominantAttractor}` : "S(t) 未记录吸引子";
      $("agentCard").innerHTML = `
        <div class="person-head">
          <div class="avatar">${esc((agent.name || agent.id || "?").slice(0, 1))}</div>
          <div><h2>${esc(agent.name || agent.id)}</h2><p class="minor">${esc(agent.job || "居民")} · ${esc(stageName(agent.ageStage))} · ${esc(placeName(locationOf(agent)))}</p></div>
        </div>
        <div class="bars">${bars(agent)}</div>
        <div class="kv"><span>当前状态</span><strong>${esc(statusOf(agent))} · 情绪：${esc(strongestMood(agent))}</strong></div>
        <div class="kv"><span>当前任务</span><strong>${esc(currentAction(agent))}</strong></div>
        <div class="kv"><span>生活状态</span><strong>${esc(agent.lifeStatus || "存活")} · 记忆 ${memoryCount(agent)} · 关系 ${relationCount(agent)}</strong></div>
        <div class="kv"><span>心理状态</span><strong>${esc(dominant)}</strong></div>
        <div class="kv"><span>关系概览</span><strong>${esc(rels.join("；") || "暂无关系数据")}</strong></div>
        <details>
          <summary>技术信息</summary>
          <div class="kv"><span>Agent ID</span><strong>${esc(agent.id)}</strong></div>
          <div class="kv"><span>Process</span><strong>${esc(JSON.stringify(agent.activeProcess || {})).slice(0, 260)}</strong></div>
          <div class="kv"><span>S(t)</span><strong>${esc(agent.psychologicalState?.version || "missing")}</strong></div>
        </details>`;
    }
    function renderAgentTable() {
      if (viewState !== "loaded") {
        $("agentTable").innerHTML = `<tr><td colspan="9">${viewState === "loading" ? "正在读取角色数据..." : "暂无角色数据"}</td></tr>`;
        return;
      }
      $("agentTable").innerHTML = agents().map(agent => {
        const [need, value] = primaryNeed(agent);
        const health = clamp(agent.needs?.health);
        const stress = pressure(agent);
        const status = statusOf(agent);
        return `<tr class="${selectedAgent === agent.id ? "selected" : ""}" data-table-agent="${esc(agent.id)}">
          <td>${esc(agent.name || agent.id)}</td><td>${esc(agent.job || "居民")}</td><td>${esc(placeName(locationOf(agent)))}</td><td>${esc(strongestMood(agent))}</td>
          <td><span class="mini-meter"><span>${health}</span><i><b style="width:${health}%"></b></i></span></td>
          <td><span class="mini-meter red"><span>${stress}</span><i><b style="width:${stress}%"></b></i></span></td>
          <td>${esc(need)} ${value}</td><td>${esc(currentAction(agent))}</td><td><span class="badge ${statusClass(status)}">${esc(status)}</span></td>
        </tr>`;
      }).join("");
      document.querySelectorAll("[data-table-agent]").forEach(row => row.addEventListener("click", () => selectAgent(row.dataset.tableAgent)));
    }
    function renderEvents() {
      if (viewState !== "loaded") {
        $("worldEvents").innerHTML = `<p class="minor">${viewState === "loading" ? "正在读取世界事件..." : "暂无世界事件"}</p>`;
        return;
      }
      const logs = naturalLogs();
      $("worldEvents").innerHTML = logs.length ? logs.map(log => `<div class="event"><time>${esc(log.time || log.at || log.tick || "-")}</time><div><strong>${esc(log.title || "世界事件")}</strong><p>${esc(log.body || log.summary || log.text || "")}</p></div><span></span></div>`).join("") : `<p class="minor">暂无世界事件</p>`;
    }
    function renderTasks() {
      if (viewState !== "loaded") {
        $("taskList").innerHTML = `<p class="minor">${viewState === "loading" ? "正在读取后台任务..." : "暂无后台任务"}</p>`;
        return;
      }
      $("taskList").innerHTML = taskRows().map(item => `<div class="task"><time>${esc(item.time)}</time><div><strong>${esc(item.title)}</strong><p>${esc(item.body)}</p></div><span class="pill">${esc(item.state)}</span></div>`).join("");
    }
    function renderDiagnostics() {
      if (viewState !== "loaded") {
        $("diagnostics").innerHTML = `<p class="minor">${viewState === "loading" ? "正在读取系统诊断..." : "暂无诊断数据"}</p>`;
        return;
      }
      const kernel = runtime.cognitiveKernel || {};
      const missing = [
        ["需求系统", agents().filter(a => !a.needs).length],
        ["多维情绪", agents().filter(a => !(a.emotionVector || a.emotions)).length],
        ["心理状态 S(t)", agents().filter(a => !a.psychologicalState).length],
        ["长期记忆", agents().filter(a => !a.memory && !a.episodicMemory && !a.beliefMemory).length],
        ["关系矩阵", agents().filter(a => !(a.relationshipMatrix || a.relationships)).length]
      ];
      $("diagnostics").innerHTML = `
        ${missing.map(([name, count]) => `<div class="kv"><span>${esc(name)}</span><strong>${count}/${agents().length} 缺失</strong></div>`).join("")}
        <details open>
          <summary>认知内核</summary>
          <div class="kv"><span>版本</span><strong>${esc(kernel.version || "-")}</strong></div>
          <div class="kv"><span>状态</span><strong>${kernel.ok ? "通过" : "需要检查"}</strong></div>
          <div class="kv"><span>缺失提交器</span><strong>${esc((kernel.missing || []).join("、") || "无")}</strong></div>
          <div class="kv"><span>旧版入口</span><strong><a href="ai-town-v2-legacy.html">打开旧版控制台</a></strong></div>
        </details>`;
    }
    function selectAgent(id) {
      selectedAgent = id;
      selectedPlace = locationOf(agents().find(agent => agent.id === id) || {}) || selectedPlace;
      renderMap(); renderPlaceDetail(); renderAgentList(); renderAgentCard(); renderAgentTable();
    }
    function selectPlace(id, open = false) {
      selectedPlace = id;
      renderMap(); renderPlaceDetail();
      if (open) openPlaceModal(id);
    }
    function openPlaceModal(id) {
      const place = places().find(item => item.id === id);
      if (!place) return;
      const here = agents().filter(agent => locationOf(agent) === id);
      $("modalTitle").textContent = place.name || place.id;
      $("modalBody").innerHTML = `
        <div class="modal-grid">${placeFacts(place).map(([label, value, wide]) => `<div class="fact ${wide || ""}"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join("")}</div>
        <div class="fact wide" style="margin-top:10px"><span>在场角色</span><div class="people">${here.length ? here.map(agent => `<button type="button" data-modal-agent="${esc(agent.id)}">${esc(agent.name || agent.id)} · ${esc(statusOf(agent))}</button>`).join("") : "无人"}</div></div>
        <div id="modalAgent"></div>`;
      document.querySelectorAll("[data-modal-agent]").forEach(btn => btn.addEventListener("click", () => {
        const agent = agents().find(item => item.id === btn.dataset.modalAgent);
        if (!agent) return;
        selectedAgent = agent.id;
        $("modalAgent").innerHTML = `<div class="fact wide" style="margin-top:10px"><span>二级角色信息</span><strong>${esc(agent.name)} · ${esc(agent.job || "居民")} · ${esc(strongestMood(agent))} · ${esc(currentAction(agent))}</strong><div class="bars">${bars(agent)}</div></div>`;
        renderAgentList(); renderAgentCard(); renderAgentTable();
      }));
      $("placeModal").classList.add("open");
      $("placeModal").setAttribute("aria-hidden", "false");
    }
    function renderAll() {
      selectedAgent ||= agents()[0]?.id || "";
      selectedPlace ||= locationOf(agents().find(agent => agent.id === selectedAgent) || {}) || places()[0]?.id || "";
      renderTop(); renderMetrics(); renderMap(); renderPlaceDetail(); renderAgentList(); renderAgentCard(); renderAgentTable(); renderEvents(); renderTasks(); renderDiagnostics();
    }
    async function loadSaves() {
      const payload = await api("/api/saves");
      saves = payload.saves || [];
      $("saveSelect").innerHTML = saves.map(save => `<option value="${esc(save.slot)}">${esc(save.clockText || save.name || save.slot)} · ${save.agentCount || 0}人</option>`).join("");
      const preferred = new URLSearchParams(location.search).get("slot") || runtime.slot || runtime.progress?.slot || saves[0]?.slot || "";
      if (preferred) $("saveSelect").value = preferred;
    }
    async function loadWorld(options = {}) {
      if (loadingWorld) return loadingWorld;
      const silent = options.silent === true && viewState === "loaded";
      loadingWorld = (async () => {
      if (!silent) {
        viewState = "loading";
        renderAll();
      }
      runtime = await api("/api/runtime/status").catch(() => ({}));
      if (!saves.length) await loadSaves();
      const slot = $("saveSelect").value || runtime.slot || runtime.progress?.slot || saves[0]?.slot;
      if (!slot) {
        viewState = "empty";
        world = { agents: [], places: [], logs: [], records: [] };
        renderAll();
        return;
      }
      const payload = await api(`/api/saves/${encodeURIComponent(slot)}/ui`);
      world = payload.world || payload || {};
      world.locationBoxes = payload.locationBoxes || world.locationBoxes || {};
      world.agents = agents();
      world.places = places();
      const logPayload = await api(`/api/saves/${encodeURIComponent(slot)}/logs?limit=100&ts=${Date.now()}`).catch(() => ({}));
      if (Array.isArray(logPayload.logs)) world.logs = logPayload.logs;
      if (Array.isArray(logPayload.records)) world.records = logPayload.records;
      viewState = agents().length || places().length ? "loaded" : "empty";
      renderAll();
      })();
      try {
        await loadingWorld;
      } finally {
        loadingWorld = null;
      }
    }
    async function command(kind) {
      const slot = $("saveSelect").value;
      const path = kind === "step" ? "/api/runtime/step" : (runtime.state === "running" || runtime.running) ? "/api/runtime/pause" : "/api/runtime/start";
      await fetch(apiBase + path, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ slot, engine:"node-core-v1" }) });
      await loadWorld();
    }
    $("refreshBtn").addEventListener("click", () => loadWorld());
    $("stepBtn").addEventListener("click", () => command("step"));
    $("toggleBtn").addEventListener("click", () => command("toggle"));
    $("saveSelect").addEventListener("change", () => { selectedAgent = ""; selectedPlace = ""; loadWorld(); });
    $("agentSearch").addEventListener("input", renderAgentList);
    document.querySelectorAll("[data-filter]").forEach(btn => btn.addEventListener("click", () => {
      filterMode = btn.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(item => item.classList.toggle("active", item === btn));
      renderAgentList();
    }));
    $("closeModal").addEventListener("click", () => $("placeModal").classList.remove("open"));
    $("placeModal").addEventListener("click", event => { if (event.target.id === "placeModal") $("placeModal").classList.remove("open"); });
    window.addEventListener("keydown", event => { if (event.key === "Escape") $("placeModal").classList.remove("open"); });
    loadWorld().catch(error => {
      viewState = "error";
      world = { agents: [], places: [], logs: [], records: [] };
      renderAll();
      $("subtitle").textContent = error.message;
      $("metrics").innerHTML = `<div class="metric"><span>读取失败</span><strong>${esc(error.message)}</strong></div>`;
    });
    setInterval(() => { if (!document.hidden) loadWorld({ silent: true }).catch(() => {}); }, 30000);
  </script>
</body>
</html>
